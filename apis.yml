aid: wrapbook
name: Wrapbook
description: Wrapbook is an AI-powered production payroll and accounting platform for
  film, TV, and commercial production, combining crew onboarding, payroll, accounts
  payable, purchase orders, production accounting, and real-time cost reporting in one
  system. It integrates with accounting software including QuickBooks, Sage Intacct,
  Oracle NetSuite, and Acumatica, and imports budgets from Movie Magic, Hot Budget, and
  Showbiz. Wrapbook publishes no public developer API, but its production app exposes an
  RFC 8414 OAuth 2.0 authorization server with 21 read-only accounting, payroll, budget,
  and purchase-order scopes that power those integrations. Backed by a16z, Bessemer
  Venture Partners, and Uncork Capital.
